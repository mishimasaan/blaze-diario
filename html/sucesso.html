<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030507">
  <title>Verificação concluída</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --primary: #ff001e;
      --accent: #c9001c;
      --background: #030507;
      --text: #e8e8e8;
      --muted: #8d9198;
      --card: 18 19 22;
      --card-opacity: .96;
      --overlay-opacity: .55;
      --button-radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text);
    }

    .page {
      position: relative;
      display: flex;
      min-height: 100dvh;
      flex-direction: column;
      overflow: hidden;
      background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 20%, transparent), var(--background) 62%);
      isolation: isolate;
    }

    .background, .background::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .background {
      z-index: -2;
      background-image: url("https://api.blazediarios.com/img/background-2.png");
      background-position: center;
      background-size: cover;
    }

    .background::before {
      position: absolute;
      inset: 0;
      content: "";
      background: radial-gradient(ellipse 80% 55% at 50% -10%, color-mix(in srgb, var(--accent) 27%, transparent), transparent 60%);
    }

    .background::after {
      content: "";
      background: rgb(0 0 0 / var(--overlay-opacity));
    }

    main {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 64px;
    }

    .card {
      display: grid;
      width: min(100%, 768px);
      grid-template-columns: .9fr 1.1fr;
      align-items: center;
      gap: 24px;
      overflow: hidden;
      padding: 32px;
      border: 1px solid transparent;
      border-radius: 20px;
      background: rgb(var(--card) / var(--card-opacity));
      box-shadow: 0 28px 70px rgb(0 0 0 / .85);
    }

    .identity, .action { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; }
    .identity { gap: 16px; }
    .action { width: 100%; gap: 12px; }

    .server { display: flex; min-width: 0; align-items: center; gap: 12px; }

    .server-icon {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 800;
    }

    .server-icon img { width: 100%; height: 100%; object-fit: cover; }
    .bot-name, .guild-name, h1, .subtitle { margin: 0; }
    .bot-name { color: var(--muted); font-size: 11px; }
    .guild-name { overflow: hidden; color: var(--text); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }

    .message { width: 100%; }
    .heading { display: flex; align-items: flex-start; gap: 8px; }

    .status-icon {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      margin-top: 2px;
      color: var(--primary);
    }

    .status-icon.error { color: #fb7185; }
    h1 { color: var(--text); font-size: clamp(20px, 3vw, 24px); font-weight: 650; letter-spacing: -.025em; line-height: 1.25; }
    .subtitle { margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .discord-button {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: var(--button-radius);
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: filter .18s ease, transform .18s ease;
    }

    .discord-button:hover { background: #c9001c; filter: brightness(1.08); transform: translateY(-1px); }
    .discord-button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, white); outline-offset: 3px; }
    .footer-text { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }




    @media (max-width: 580px) {
      main { padding-block: 28px 72px; }
      .card { grid-template-columns: 1fr; gap: 22px; padding: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="background" aria-hidden="true"></div>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="identity">
          <div class="server">
            <div class="server-icon">
              <img src="https://cdn.discordapp.com/icons/1539903643090821133/a75132b2a3b860c7830134e71053069c.png?size=512" alt="Ícone do Blaze Diário" referrerpolicy="no-referrer">
            </div>
            <div>
              <p class="bot-name">Verificação</p>
              <p class="guild-name">Blaze Diário</p>
            </div>
          </div>

          <div class="message">
            <div class="heading">
              <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
              <h1 id="page-title">Acesso confirmado</h1>
            </div>
            <p class="subtitle" id="subtitle">Sua conta foi verificada com sucesso.</p>
          </div>
        </div>

        <div class="action">
          <a class="discord-button" href="https://discord.com/channels/@me">Voltar ao Discord</a>
        </div>
      </section>

</body>
</html>
