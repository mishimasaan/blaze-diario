<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Página não encontrada — Blaze Diários."
  >

  <meta
    name="robots"
    content="noindex"
  >

  <title>Página não encontrada | Blaze Diários</title>

  <link
    rel="stylesheet"
    href="./css/reset.css"
  >

  <link
    rel="stylesheet"
    href="./css/variables.css"
  >

  <link
    rel="stylesheet"
    href="./css/global.css"
  >

  <link
    rel="stylesheet"
    href="./css/404.css"
  >

  <link
    rel="stylesheet"
    href="./css/components/navbar.css"
  >

  <link
    rel="stylesheet"
    href="./css/components/button-animation.css"
  >

  <link
    rel="stylesheet"
    href="./css/components/footer.css"
  >
</head>

<body>

  <div id="navbar-component"></div>

  <main class="error-page">

    <section class="error-page__section">

      <div class="container error-page__container">

        <div class="error-page__content">

          <span class="error-page__eyebrow">
            Página não encontrada
          </span>

          <div
            class="error-page__code"
            aria-hidden="true"
          >
            404
          </div>

          <h1 class="error-page__title">
            Parece que você
            <strong>caiu da sala.</strong>
          </h1>

          <p class="error-page__description">
            A página que você tentou acessar não existe,
            foi removida ou teve o endereço alterado.
          </p>

          <div class="error-page__actions">

            <a
              class="button button--primary"
              href="./index.html"
            >
              <span>
                Voltar ao início
              </span>

              <span aria-hidden="true">
                →
              </span>
            </a>

            <a
              class="error-page__link"
              href="./diarios.html#solo"
            >
              Ver diários disponíveis
            </a>

          </div>

        </div>

        <div
          class="error-page__visual"
          aria-hidden="true"
        >

          <div class="error-page__number">
            <span>4</span>

            <div class="error-page__target">
              <div class="error-page__target-dot"></div>
            </div>

            <span>4</span>
          </div>

          <span class="error-page__visual-text">
            ROTA NÃO ENCONTRADA
          </span>

        </div>

      </div>

    </section>

  </main>

  <div id="footer-component"></div>

  <script src="./js/comp/botton.js"></script>
  <script src="./js/main.js"></script>

</body>

</html>
